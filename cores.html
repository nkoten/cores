
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">
    <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
        body main {
          display: grid;
          grid-template-columns: 45% 45%;
          gap: 1rem;
          padding: 1rem;
        }
    </style>
  </head>
  <body>
    <main id="main">
      
    </main>

    <script>
      const template = arg => {
        const id = Math.ceil( Math.random() * 999999999 );
        style = `
        #template${id} {
          background: ${arg.c1};
          color: ${arg.text};
          width: 170px;
          height: 400px;
          position: relative;
          border-radius: 1rem;
          overflow: hidden;
        }
        #appbar${id} {
          background: ${arg.c0};
          width: 100%;
          height: 25px;
          position: absolute;
          top: 0;
          left: 0;
          align-items: center;
          justify-content: center;
        }
        #sidebar${id} {
          background: ${arg.c0};
          width: 25%;
          height: calc( 100% - 25px );
          position: absolute;
          top: 25px;
          left: 0;
        }
        #main${id} {
          background: ${arg.c1};
          width: 100%;
          height: 100%;
        }
        template-tag, appbar, sidebar, main {
          display: flex;
        }
        `;
        return `
          <template-tag id="template${id}">
            <style>${style}</style>
            <appbar id="appbar${id}">${arg.id}</appbar>
            <sidebar id="sidebar${id}"></sidebar>
            <main id="main${id}"></main>
          </template-tag>
        `
      };

      const themes = {
        rosePine: {
          id: "rosé-pine",
          c0: "#191724",
          c1: "#1f1d2e",
          text: "#fff",
        },
      };

      main.innerHTML += template(themes.rosePine);
      main.innerHTML += template(themes.rosePine);
    </script>
  
  </body>
</html>
